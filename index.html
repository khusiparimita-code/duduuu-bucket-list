<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Things To Do With My Bubuuuu ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #ffe6ee, #fff5f8);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #4a2632;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.9);
      padding: 30px 25px;
      border-radius: 25px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
    }

    .heart {
      text-align: center;
      font-size: 45px;
      animation: heartbeat 1.5s infinite;
    }

    @keyframes heartbeat {
      50% {
        transform: scale(1.15);
      }
    }

    h1 {
      text-align: center;
      color: #d94f70;
      margin: 10px 0 5px;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .todo {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 17px;
      margin: 12px 0;
      background: #fff7f9;
      border-radius: 16px;
      border: 1px solid #ffd9e3;
      cursor: pointer;
      transition: 0.3s;
    }

    .todo:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(217, 79, 112, 0.12);
    }

    .todo input {
      width: 21px;
      height: 21px;
      accent-color: #d94f70;
      cursor: pointer;
      flex-shrink: 0;
    }

    .emoji {
      font-size: 27px;
    }

    .text {
      flex: 1;
    }

    .text h3 {
      font-size: 16px;
      margin-bottom: 4px;
      color: #d94f70;
    }

    .text p {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    .todo.completed {
      background: #fce0e8;
    }

    .todo.completed .text h3,
    .todo.completed .text p {
      text-decoration: line-through;
      opacity: 0.6;
    }

    .progress {
      margin-top: 25px;
      text-align: center;
      font-size: 14px;
      color: #777;
    }

    .progress-bar {
      height: 9px;
      background: #f1d7df;
      border-radius: 20px;
      margin-top: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #d94f70;
      border-radius: 20px;
      transition: width 0.4s ease;
    }

    .love-message {
      text-align: center;
      margin-top: 25px;
      font-size: 15px;
      color: #d94f70;
      font-weight: bold;
      display: none;
    }

    .love-message.show {
      display: block;
      animation: fadeIn 0.8s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="heart">❤️</div>

    <h1>Things To Do With My Duduuuu</h1>

    <p class="subtitle">
      Our little bucket list 🥹💕
    </p>

    <!-- 1 -->
    <label class="todo">
      <input type="checkbox">
      <span class="emoji">🌅</span>

      <div class="text">
        <h3>Late night movie date</h3>
        <p>
          Apne Duduuuu ke saath last sunrise movie dekhna hai 🥺❤️
        </p>
      </div>
    </label>

    <!-- 2 -->
    <label class="todo">
      <input type="checkbox">
      <span class="emoji">🛍️</span>

      <div class="text">
        <h3>Shopping Date</h3>
        <p>
          Saath mein shopping pe jaana hai 🛒💕
        </p>
      </div>
    </label>

    <!-- 3 -->
    <label class="todo">
      <input type="checkbox">
      <span class="emoji">🌹</span>

      <div class="text">
        <h3>College Pick-Up</h3>
        <p>
          Duduuuuu ko college se pick karna hai flowers ke sath🌹🥹
        </p>
      </div>
    </label>

    <!-- 4 -->
    <label class="todo">
      <input type="checkbox">
      <span class="emoji">🧴</span>

      <div class="text">
        <h3>Skincare Together</h3>
        <p>
          Saath mein skincare karna hai — our cute self-care date 🫶🏻✨
        </p>
      </div>
    </label>

    <!-- 5 -->
    <label class="todo">
      <input type="checkbox">
      <span class="emoji">🍗</span>

      <div class="text">
        <h3>Cook For My Bubu</h3>
        <p>
          Duduuuuu ke liye unki favourite Biryani banaani hai 😋❤️
        </p>
      </div>
    </label>

    <!-- 6 -->
    <label class="todo">
      <input type="checkbox">
      <span class="emoji">🚗</span>

      <div class="text">
        <h3>Late-Night Long Drive</h3>
        <p>
          Raat ko Duduuuuuu ke saath long drive pe jaana hai 🌙✨
        </p>
      </div>
    </label>

    <!-- 7 -->
    <label class="todo">
      <input type="checkbox">
      <span class="emoji">🫂</span>

      <div class="text">
        <h3>Cuddle All Day</h3>
        <p>
          Bas Dudduuu ko cuddle karke din bhar saath rehna hai 🥺❤️
        </p>
      </div>
    </label>

    <!-- Progress -->
    <div class="progress">
      <span id="progressText">0 / 7 completed 💕</span>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="love-message" id="loveMessage">
      🎉 Everything is completed! 🎉<br>
      <br>
      Bas ab Duduuuuu ke saath ye saari memories banani hain. ❤️🥹
    </div>

    <div class="footer">
      Made with ❤️ for my Duduuuuuu
    </div>

  </div>


  <script>

    const todos = document.querySelectorAll(".todo");
    const progressText = document.getElementById("progressText");
    const progressFill = document.getElementById("progressFill");
    const loveMessage = document.getElementById("loveMessage");

    todos.forEach(todo => {

      const checkbox = todo.querySelector("input");

      checkbox.addEventListener("change", () => {

        if (checkbox.checked) {
          todo.classList.add("completed");
        } else {
          todo.classList.remove("completed");
        }

        updateProgress();

      });

    });


    function updateProgress() {

      const completed =
        document.querySelectorAll(".todo input:checked").length;

      const total = todos.length;

      const percentage = (completed / total) * 100;

      progressText.innerHTML =
        `${completed} / ${total} completed 💕`;

      progressFill.style.width =
        percentage + "%";


      if (completed === total) {

        loveMessage.classList.add("show");

      } else {

        loveMessage.classList.remove("show");

      }

    }

  </script>

</body>
</html>
